[project]
name = "ow-banking-project"
version = "0.1.0"
description = "Transaction-level premium card upgrade recommendation engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
